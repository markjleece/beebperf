name: Build and Release BeebPerf 1.0.0

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (upload artifacts only)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

  push:
    tags:
      - 'v1.0.0'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: v1.0.0
  IS_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == 'true' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Checkout main repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install .NET 9 GA
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Restore NuGet packages (including WebView2)
      - name: Restore NuGet packages
        run: dotnet restore BeebPerf.sln

      # Setup MSBuild BEFORE building BeebPerf
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Build main project (x64)
      - name: Build BeebPerf.sln
        run: dotnet build BeebPerf.sln -c Release -p:Platform=x64

      # Clone BeebEm 4.19
      - name: Clone BeebEm 4.19
        run: |
          git clone --branch 4.19 --depth 1 https://github.com/stardot/beebem-windows.git External/BeebEm

      # Apply patch
      - name: Apply BeebEm patch
        working-directory: External/BeebEm
        run: git apply ../../beebem_changelist.diff

      # Verify patch applied
      - name: Verify patch applied
        working-directory: External/BeebEm
        run: |
          git diff --quiet || (Write-Host "Patch applied successfully." ; exit 0)
          Write-Error "Patch did not apply correctly." ; exit 1

      # Install DirectX SDK June 2010
      - name: Install DirectX SDK June 2010
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)")) {
            choco install directx-sdk-jun2010 -y
          } else {
            Write-Host "DirectX SDK already installed."
          }

      # Setup MSBuild BEFORE building BeebEm
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Build BeebEm
      - name: Build BeebEm
        working-directory: External/BeebEm/Src
        run: msbuild BeebEm.sln /p:Configuration=Release /p:Platform=x64

      # Create package directory
      - name: Create package directory
        run: mkdir -Force package

      # Package BeebPerf
      - name: Package BeebPerf
        run: |
          powershell Compress-Archive `
            -Path "BeebPerf/bin/Release/net9.0-windows8.0/*" `
            -DestinationPath "package/BeebPerf.zip" `
            -Force

      # Package ExtractLabels
      - name: Package ExtractLabels
        run: |
          powershell Compress-Archive `
            -Path "ExtractLabels/bin/Release/net9.0-windows8.0/*" `
            -DestinationPath "package/ExtractLabels.zip" `
            -Force

      # Package BeebEm
      - name: Package BeebEm
        run: |
          powershell Compress-Archive `
            -Path "External/BeebEm/Src/x64/Release/*" `
            -DestinationPath "package/BeebEm.zip" `
            -Force

      # Attest ZIPs (GitHub provenance)
      - name: Attest BeebPerf.zip
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: package/BeebPerf.zip

      - name: Attest ExtractLabels.zip
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: package/ExtractLabels.zip

      - name: Attest BeebEm.zip
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: package/BeebEm.zip

      # Test mode: upload artifacts
      - name: Upload test artifacts
        if: env.IS_TEST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beebperf-test-binaries
          path: package/*.zip

      # Release mode: upload to existing BeebPerf 1.0.0 release
      - name: Upload assets to release
        if: env.IS_TEST != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:RELEASE_TAG" `
            package/BeebPerf.zip `
            package/ExtractLabels.zip `
            package/BeebEm.zip `
            --clobber
