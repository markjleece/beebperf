name: Build and Release BeebPerf 1.0.0

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (upload artifacts only)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

  push:
    tags:
      - 'v1.0.0'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: v1.0.0
  IS_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == 'true' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet packages
        run: |
          dotnet restore BeebPerf/BeebPerf.csproj
          dotnet restore ExtractLabels/ExtractLabels.csproj

      - name: Build .NET projects
        run: |
          dotnet build BeebPerf/BeebPerf.csproj -c Release -p:Platform=x64 -f net9.0-windows8.0
          dotnet build ExtractLabels/ExtractLabels.csproj -c Release -p:Platform=x64 -f net9.0-windows8.0

      - name: Debug: List BeebPerf output
        shell: pwsh
        run: |
          Write-Host "=== BeebPerf/bin/Release ==="
          Get-ChildItem "BeebPerf/bin/Release"
          Write-Host "=== BeebPerf/bin/Release/* ==="
          Get-ChildItem "BeebPerf/bin/Release" -Recurse

      - name: Debug: List ExtractLabels output
        shell: pwsh
        run: |
          Write-Host "=== ExtractLabels/bin/Release ==="
          Get-ChildItem "ExtractLabels/bin/Release"
          Write-Host "=== ExtractLabels/bin/Release/* ==="
          Get-ChildItem "ExtractLabels/bin/Release" -Recurse

      - name: Clone BeebEm
        run: |
          git clone --depth 1 https://github.com/stardot/beebem-windows.git External/BeebEm

      - name: Apply BeebEm patch
        working-directory: External/BeebEm
        run: git apply ../../beebem_changelist.diff

      - name: Clone DXSDK subset (private repo)
        uses: actions/checkout@v4
        with:
          repository: markjleece/beebem-dxsdk
          token: ${{ secrets.DXSDK_TOKEN }}
          path: External/DXSDK

      - name: Set DXSDK_DIR
        run: echo "DXSDK_DIR=$PWD/External/DXSDK" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build zlib
        run: msbuild zlib/zlib.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build BeebEm
        working-directory: External/BeebEm/Src
        run: msbuild BeebEm.sln /p:Configuration=Release /p:Platform=x64

      - name: Create package directory
        run: mkdir -Force package

      - name: Package BeebPerf
        run: |
          powershell Compress-Archive `
            -Path "BeebPerf/bin/Release/net9.0-windows8.0/*" `
            -DestinationPath "package/BeebPerf.zip" `
            -Force

      - name: Package ExtractLabels
        run: |
          powershell Compress-Archive `
            -Path "ExtractLabels/bin/Release/net9.0-windows8.0/*" `
            -DestinationPath "package/ExtractLabels.zip" `
            -Force

      - name: Package BeebEm
        run: |
          powershell Compress-Archive `
            -Path "External/BeebEm/Src/x64/Release/*" `
            -DestinationPath "package/BeebEm.zip" `
            -Force

      - name: Attest BeebPerf.zip
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: package/BeebPerf.zip

      - name: Attest ExtractLabels.zip
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: package/ExtractLabels.zip

      - name: Attest BeebEm.zip
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: package/BeebEm.zip

      - name: Upload test artifacts
        if: env.IS_TEST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beebperf-test-binaries
          path: package/*.zip

      - name: Upload assets to release
        if: env.IS_TEST != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:RELEASE_TAG" `
            package/BeebPerf.zip `
            package/ExtractLabels.zip `
            package/BeebEm.zip `
            --clobber
